<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        main {
            background-color: beige;
            height: 200vh;
        }

        .text {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        .text .head {
            font-size: xxx-large;
            font-weight: 700;
        }

        .icon {
            height: 50px;
            width: 50px;
            border: 2px solid;
            display: inline-block;
            position: fixed;
            /* z-index: 3; */
            background-image: url(icon.png);
            background-size: cover;
            /* left: 95%; */
            right: 5px;
            /* top: 93%; */
            bottom: 5px;
            border-radius: 50%;
        }

        nav {
            position: fixed;
            display: flex;
            height: 50px;
            width: 100%;
            justify-content: space-evenly;
            background-color: #4E312D;
            align-items: center;
            font-size: large;
        }

        a {
            color: whitesmoke;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main>
        <nav>
            <a href="">Home</a><a href="">About</a><a href="">Product</a><a href="">Service</a><a href="">Contact</a>
        </nav>
        <div class="text">
            <p class="head">Welcome to the website</p>
            <p class="desc">This is the place for description of the website</p>
            <div class="icon">
                <!-- <img src="icon.jpg" alt="" height="45px" width="45px"> -->
            </div>
        </div>
    </main>
</body>

</html>
